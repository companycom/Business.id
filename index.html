<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALDI GROUP — Kunjungi Bisnis & Event Kami</title>
<meta name="description" content="Kunjungi bisnis dan event kami. Semua pembayaran transfer melalui scan DANA.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f2ec;
    --ink:#141414;
    --ink-soft:#5a5750;
    --line:#ddd7c9;
    --navy:#1e3a8a;
    --navy-light:#93b4ff;
    --accent:#c2562c;
    --dana:#118eea;
    --green:#4CAF50;
    --green-dark:#3e8e41;
  }
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    font-size:16px;
  }

  /* --- NAVBAR --- */
  .navbar{
    width:100%;
    max-width:900px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 24px rgba(20,20,20,.06);
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:20px;
    font-weight:800;
    color:var(--navy);
    text-decoration:none;
  }
  .logo span{color:var(--ink)}
  .nav-links{
    display:flex;
    gap:22px;
    list-style:none;
  }
  .nav-links a{
    text-decoration:none;
    color:var(--ink-soft);
    font-weight:500;
    font-size:14px;
    transition:color .3s;
  }
  .nav-links a:hover{color:var(--navy)}
  .nav-actions{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .btn-login{
    text-decoration:none;
    color:var(--ink);
    font-weight:600;
    font-size:14px;
    background:none;
    border:none;
    cursor:pointer;
    padding:8px 12px;
    border-radius:8px;
    transition:background .2s;
  }
  .btn-login:hover{background:#f0ede6}
  .btn-try{
    background:var(--green);
    color:#fff;
    padding:9px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    font-size:13px;
    border:none;
    cursor:pointer;
    transition:background .3s;
  }
  .btn-try:hover{background:var(--green-dark)}
  .user-info{
    display:none;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:var(--ink);
  }
  .user-info .avatar{
    width:34px;height:34px;
    background:var(--navy);
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:14px;
  }
  .btn-logout{
    background:#ff4b2b;
    color:#fff;
    border:none;
    padding:7px 13px;
    border-radius:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    transition:background .2s;
  }
  .btn-logout:hover{background:#e03a1c}

  /* --- KARTU UTAMA --- */
  .card{
    width:100%;
    max-width:560px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    padding:48px 40px;
    text-align:center;
    box-shadow:0 24px 60px rgba(20,20,20,.08);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-40%;right:-40%;
    width:160%;height:160%;
    background:radial-gradient(circle,rgba(30,58,138,.07) 0%,transparent 60%);
    pointer-events:none;
  }
  .card > *{position:relative;z-index:1}

  .logo-mark{
    width:56px;height:56px;
    margin:0 auto 20px;
    display:grid;place-items:center;
    background:var(--ink);color:var(--bg);
    border-radius:14px;
    font-weight:700;font-size:1.15rem;letter-spacing:-0.06em;
    position:relative;overflow:hidden;
  }
  .logo-mark::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(135deg,transparent 40%,rgba(147,180,255,.35));
    pointer-events:none;
  }
  .logo-mark span{color:var(--navy-light);position:relative;z-index:1}
  .logo-mark strong{color:var(--bg);position:relative;z-index:1}

  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(1.6rem,4vw,2.1rem);
    letter-spacing:-0.02em;
    line-height:1.2;
    margin-bottom:12px;
  }
  p.lead{
    font-size:1rem;
    color:var(--ink-soft);
    line-height:1.7;
    margin-bottom:28px;
    max-width:40ch;
    margin-left:auto;
    margin-right:auto;
  }

  /* --- TOMBOL AKSI --- */
  .btn-group{
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
    margin-bottom:8px;
  }
  .btn-visit{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 32px;
    background:var(--ink);
    color:var(--bg);
    border-radius:99px;
    font-weight:500;
    font-size:.95rem;
    transition:all .3s;
    border:1px solid var(--ink);
    text-decoration:none;
    width:100%;
    max-width:320px;
  }
  .btn-visit:hover{
    background:var(--navy);
    border-color:var(--navy);
    transform:translateY(-3px);
    box-shadow:0 16px 34px rgba(30,58,138,.3);
  }
  .btn-visit svg{width:16px;height:16px;transition:transform .3s}
  .btn-visit:hover svg{transform:translate(3px,-3px)}

  .btn-event{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 32px;
    background:var(--green);
    color:#fff;
    border-radius:99px;
    font-weight:600;
    font-size:.95rem;
    transition:all .3s;
    border:1px solid var(--green);
    text-decoration:none;
    width:100%;
    max-width:320px;
    box-shadow:0 8px 20px rgba(76,175,80,.25);
  }
  .btn-event:hover{
    background:var(--green-dark);
    border-color:var(--green-dark);
    transform:translateY(-3px);
    box-shadow:0 16px 30px rgba(76,175,80,.4);
  }
  .btn-event svg{width:18px;height:18px;transition:transform .3s}
  .btn-event:hover svg{transform:translateX(4px)}

  /* --- CATATAN PEMBAYARAN --- */
  .note{
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:.9rem;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .note strong{color:var(--ink);font-weight:600}
  .note .highlight{
    display:inline-block;
    margin-top:10px;
    padding:7px 16px;
    background:rgba(17,142,234,.1);
    color:var(--dana);
    border:1px solid rgba(17,142,234,.3);
    border-radius:99px;
    font-weight:600;
    font-size:.85rem;
    letter-spacing:.04em;
  }

  /* --- MODAL --- */
  .modal-overlay{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(5px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
    padding:20px;
  }
  .modal-overlay.active{
    display:flex;
    animation:fadeIn .3s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .modal-box{
    background:#fff;
    width:100%;
    max-width:420px;
    border-radius:20px;
    padding:36px 28px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    animation:slideUp .4s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}

  .modal-close{
    position:absolute;
    top:14px;right:18px;
    font-size:28px;
    color:#999;
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
    transition:color .2s;
  }
  .modal-close:hover{color:#333}

  .modal-tabs{
    display:flex;
    margin-bottom:26px;
    border-bottom:2px solid #eee;
  }
  .tab-btn{
    flex:1;
    padding:12px;
    background:none;
    border:none;
    font-size:16px;
    font-weight:600;
    color:#999;
    cursor:pointer;
    border-bottom:3px solid transparent;
    margin-bottom:-2px;
    transition:all .3s;
  }
  .tab-btn.active{
    color:var(--navy);
    border-bottom-color:var(--navy);
  }

  .form-group{margin-bottom:16px}
  .form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
  }
  .form-group input{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    transition:border .3s;
    font-family:inherit;
  }
  .form-group input:focus{
    outline:none;
    border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(30,58,138,.1);
  }

  .remember-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .remember-row input[type="checkbox"]{
    width:16px;height:16px;
    accent-color:var(--navy);
    cursor:pointer;
  }
  .remember-row label{cursor:pointer;user-select:none}

  .btn-submit{
    width:100%;
    padding:14px;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:background .3s;
    margin-top:8px;
    font-family:inherit;
  }
  .btn-submit:hover{background:var(--green-dark)}
  .btn-submit:disabled{opacity:.6;cursor:not-allowed}

  .form-message{
    margin-top:14px;
    padding:10px;
    border-radius:6px;
    font-size:13px;
    text-align:center;
    display:none;
  }
  .form-message.error{
    background:#ffe0e0;
    color:#d32f2f;
    display:block;
  }
  .form-message.success{
    background:#e0f7e0;
    color:#2e7d32;
    display:block;
  }

  /* --- RESPONSIF --- */
  @media(max-width:640px){
    body{padding:16px}
    .navbar{padding:12px 16px}
    .nav-links{display:none}
    .card{padding:36px 24px;border-radius:18px}
    .btn-visit,.btn-event{max-width:100%;padding:14px 24px;font-size:.9rem}
    .modal-box{padding:28px 20px}
  }
</style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="#" class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      Aldi<span>Grup</span>
    </a>

    <ul class="nav-links">
      <li><a href="#layanan">Layanan</a></li>
      <li><a href="#event">Event</a></li>
      <li><a href="#kontak">Kontak</a></li>
    </ul>

    <div class="nav-actions" id="guestView">
      <button class="btn-login" onclick="openModal('login')">MASUK</button>
      <button class="btn-try" onclick="openModal('register')">DAFTAR</button>
    </div>

    <div class="user-info" id="userView">
      <div class="avatar" id="userAvatar">A</div>
      <span id="userName">User</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- KARTU UTAMA -->
  <div class="card" id="layanan">
    <div class="logo-mark" aria-hidden="true"><strong>A</strong><span>G</span></div>

    <h1>ALDI GROUP</h1>
    <p class="lead">Kunjungi bisnis dan layanan kami, atau lihat event terbaru yang sedang berlangsung.</p>

    <div class="btn-group">
      <!-- Tombol kunjungi bisnis -->
      <a href="https://companycom.github.io/lobby.com" target="_blank" rel="noopener noreferrer" class="btn-visit">
        Kunjungi Bisnis Kami
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>

      <!-- Tombol Lihat Event -->
      <a href="https://companycom.github.io/event.co" target="_blank" rel="noopener noreferrer" class="btn-event" id="event">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"></circle></svg>
        Lihat Event
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
      </a>
    </div>

    <div class="note" id="kontak">
      <strong>Informasi Pembayaran</strong><br>
      Semua pembayaran dilakukan melalui transfer dengan scan DANA.
      <br>
      <span class="highlight">DANA · Scan &amp; Transfer</span>
    </div>
  </div>

  <!-- MODAL LOGIN / REGISTER -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">&times;</button>

      <div class="modal-tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Masuk</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- FORM LOGIN -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="email@contoh.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <div class="remember-row">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">Ingat saya di perangkat ini</label>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">MASUK</button>
        <div class="form-message" id="loginMessage"></div>
      </form>

      <!-- FORM REGISTER -->
      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="regName" placeholder="Nama Anda" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="email@contoh.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-submit" id="registerBtn">DAFTAR SEKARANG</button>
        <div class="form-message" id="registerMessage"></div>
      </form>
    </div>
  </div>

  <script>
    /* ============================================================
       STORAGE LAYER — aman terhadap localStorage diblokir/penuh
       ============================================================ */
    const STORAGE_USERS = 'aldiUsers';
    const STORAGE_SESSION = 'aldiCurrentUser';

    // Fallback in-memory jika localStorage tidak tersedia (mis. private mode ketat)
    const memoryStore = {};
    const storage = {
      get(key) {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return memoryStore[key] ?? null;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          memoryStore[key] = value;
        }
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch (e) {
          delete memoryStore[key];
        }
      }
    };

    /* ============================================================
       HASHING PASSWORD — SHA-256 + salt tetap per aplikasi
       Catatan: untuk produksi sungguhan gunakan backend + bcrypt/argon2.
       ============================================================ */
    const APP_SALT = 'aldi-group-v1';

    async function hashPassword(password) {
      const data = new TextEncoder().encode(APP_SALT + '::' + password);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    /* ============================================================
       UTIL
       ============================================================ */
    function readUsers() {
      try {
        return JSON.parse(storage.get(STORAGE_USERS)) || [];
      } catch (e) {
        return [];
      }
    }
    function writeUsers(users) {
      storage.set(STORAGE_USERS, JSON.stringify(users));
    }
    function readSession() {
      try {
        return JSON.parse(storage.get(STORAGE_SESSION));
      } catch (e) {
        return null;
      }
    }
    function writeSession(user) {
      storage.set(STORAGE_SESSION, JSON.stringify(user));
    }
    function clearSession() {
      storage.remove(STORAGE_SESSION);
    }

    /* ============================================================
       MIGRASI DATA LAMA
       Data lama menyimpan password plaintext. Kita konversi ke hash
       agar tetap bisa login & lebih aman.
       ============================================================ */
    async function migrateLegacyUsers() {
      const users = readUsers();
      let changed = false;
      for (const u of users) {
        // Tandai user lama yang belum punya field passwordHash
        if (!u.passwordHash && typeof u.password === 'string') {
          u.passwordHash = await hashPassword(u.password);
          delete u.password;
          changed = true;
        }
        // Pastikan ada createdAt
        if (!u.createdAt) {
          u.createdAt = new Date().toISOString();
          changed = true;
        }
      }
      if (changed) writeUsers(users);
    }

    /* ============================================================
       MODAL
       ============================================================ */
    const authModal = document.getElementById('authModal');

    function openModal(mode) {
      authModal.classList.add('active');
      switchTab(mode);
    }

    function closeModal() {
      authModal.classList.remove('active');
      document.getElementById('loginMessage').className = 'form-message';
      document.getElementById('registerMessage').className = 'form-message';
    }

    authModal.addEventListener('click', (e) => {
      if (e.target === authModal) closeModal();
    });

    function switchTab(mode) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if (mode === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    /* ============================================================
       REGISTER
       ============================================================ */
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      const msg = document.getElementById('registerMessage');
      const btn = document.getElementById('registerBtn');

      // Pastikan data lama sudah dimigrasi sebelum cek duplikat
      await migrateLegacyUsers();

      const users = readUsers();
      if (users.find(u => u.email === email)) {
        msg.className = 'form-message error';
        msg.textContent = 'Email sudah terdaftar! Silakan login.';
        return;
      }

      btn.disabled = true;
      try {
        const passwordHash = await hashPassword(password);
        users.push({
          name,
          email,
          passwordHash,
          createdAt: new Date().toISOString()
        });
        writeUsers(users);

        msg.className = 'form-message success';
        msg.textContent = 'Pendaftaran berhasil! Silakan login.';

        document.getElementById('registerForm').reset();
        setTimeout(() => {
          switchTab('login');
          document.getElementById('loginEmail').value = email;
          msg.className = 'form-message';
        }, 1500);
      } catch (err) {
        msg.className = 'form-message error';
        msg.textContent = 'Terjadi kesalahan saat mendaftar. Coba lagi.';
      } finally {
        btn.disabled = false;
      }
    }

    /* ============================================================
       LOGIN
       ============================================================ */
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;
      const msg = document.getElementById('loginMessage');
      const btn = document.getElementById('loginBtn');

      await migrateLegacyUsers();

      const users = readUsers();
      btn.disabled = true;
      try {
        const passwordHash = await hashPassword(password);
        const user = users.find(u => u.email === email && u.passwordHash === passwordHash);

        if (!user) {
          msg.className = 'form-message error';
          msg.textContent = 'Email atau password salah!';
          return;
        }

        // Simpan sesi (tanpa password/hash)
        const sessionUser = {
          name: user.name,
          email: user.email,
          loginAt: new Date().toISOString(),
          remember: remember
        };
        writeSession(sessionUser);

        msg.className = 'form-message success';
        msg.textContent = 'Login berhasil!';

        setTimeout(() => {
          closeModal();
          updateUI();
          document.getElementById('loginForm').reset();
          document.getElementById('rememberMe').checked = true;
          msg.className = 'form-message';
        }, 800);
      } catch (err) {
        msg.className = 'form-message error';
        msg.textContent = 'Terjadi kesalahan saat login. Coba lagi.';
      } finally {
        btn.disabled = false;
      }
    }

    /* ============================================================
       LOGOUT
       ============================================================ */
    function logout() {
      clearSession();
      updateUI();
      alert('Anda telah logout. Akun Anda tetap tersimpan.');
    }

    /* ============================================================
       UI
       ============================================================ */
    function updateUI() {
      const currentUser = readSession();
      const guestView = document.getElementById('guestView');
      const userView = document.getElementById('userView');

      if (currentUser) {
        guestView.style.display = 'none';
        userView.style.display = 'flex';
        document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('userAvatar').textContent =
          currentUser.name.charAt(0).toUpperCase();
      } else {
        guestView.style.display = 'flex';
        userView.style.display = 'none';
      }
    }

    /* ============================================================
       INIT
       ============================================================ */
    window.addEventListener('DOMContentLoaded', async () => {
      await migrateLegacyUsers();
      updateUI();
    });

    // Sinkronkan antar-tab: kalau user login/logout di tab lain
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_SESSION) updateUI();
    });
  </script>
</body>
</html>
