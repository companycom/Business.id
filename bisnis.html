<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .icon {
            font-size: 90px;
            margin-bottom: 20px;
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d2ff;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.2s infinite;
        }

        .contact {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        .contact a {
            color: #00d2ff;
            text-decoration: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.7rem; }
            .icon { font-size: 70px; }
            p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Sedang Maintenance</h1>
        <p>Kami sedang melakukan pemeliharaan singkat. Silakan coba beberapa saat lagi.</p>

        <div class="badge"><span class="dot"></span>Kami akan segera kembali</div>

        <div class="contact">
            Butuh bantuan? Hubungi <a href="mailto:support@example.com">support@example.com</a>
        </div>
    </div>
</body>
</html>
